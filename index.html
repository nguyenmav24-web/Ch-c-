<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>Chợ đồ cũ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Chợ đồ cũ</h1>

<div id="account">

<button onclick="login()">Đăng nhập</button>
<button onclick="logout()">Đăng xuất</button>

<p id="user">Chưa đăng nhập</p>

</div>

<hr>

<div id="home">

<h2>Trang chính</h2>

<button onclick="openMarket()">Chợ đồ cũ</button>

<br><br>

<button onclick="openUpload()">Nơi đăng đồ</button>

</div>


<div id="market" style="display:none">

<h2>Chợ đồ cũ</h2>

<button onclick="back()">← Quay lại</button>

<div id="items"></div>

</div>


<div id="upload" style="display:none">

<h2>Nơi đăng đồ</h2>

<button onclick="back()">← Quay lại</button>

<br><br>

<input type="file" id="image">

<br><br>

<input type="text" id="name" placeholder="Tên món đồ">

<br><br>

<textarea id="desc" placeholder="Mô tả"></textarea>

<br><br>

<button onclick="upload()">Đăng món đồ</button>

</div>

<script src="script.js"></script>

</body>

</html>
