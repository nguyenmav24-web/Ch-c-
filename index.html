```html
<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NguyenMav24</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div id="particles"></div>

<div id="loading">

<h1>NguyenMav24</h1>

<p>Loading...</p>

</div>

<div id="login-box">

<h1>NguyenMav24</h1>

<button id="loginSelect"
onclick="showLogin()">

Đăng nhập

</button>

<br><br>

<button id="registerSelect"
onclick="showRegister()">

Đăng ký

</button>

<div id="form-box">

<input type="text"
id="username"
placeholder="Tên tài khoản">

<input type="password"
id="password"
placeholder="Mật khẩu">

<br><br>

<button id="actionBtn"></button>

<p id="error"></p>

</div>

</div>

<div id="web-content">

<div class="topbar">

<h2>NguyenMav24</h2>

<div>

<button onclick="openHome()">
Home
</button>

<button onclick="openMarket()">
Market
</button>

<button onclick="openUpload()">
Upload
</button>

<button onclick="logout()">
Logout
</button>

</div>

</div>

<div id="home">

<div class="hero">

<h1>Welcome 👋</h1>

<p>
Website dark mode hiện đại
</p>

</div>

<div class="grid">

<div class="card">

<h2>Profile</h2>

<p id="profileName">
Người dùng
</p>

</div>

<div class="card">

<h2>Status</h2>

<p>Online</p>

</div>

<div class="card">

<h2>Design</h2>

<p>Modern UI</p>

</div>

</div>

</div>

<div id="market">

<h1>Marketplace</h1>

<div id="items"></div>

</div>

<div id="upload">

<div class="card">

<h2>Đăng sản phẩm</h2>

<input type="text"
id="name"
placeholder="Tên sản phẩm">

<textarea id="desc"
placeholder="Mô tả"></textarea>

<input type="file"
id="image">

<br><br>

<button onclick="upload()">
Đăng
</button>

</div>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
```
